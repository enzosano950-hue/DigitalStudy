<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELA DE LOGIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:wght@200&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Josefin Sans";
            background-color: rgb(51, 51, 51);
          
            text-align: center;
            margin-top: 50px;
        }
        form {
            padding: 20px;
            border-radius: 5px;
            display: inline-block;
            text-align: left;
            box-shadow: 0 0 10px rgba(red, green, blue, alpha);
        }
        label{
            display: inline-block;
            width: 150px;
            margin-bottom: 10px;
            text-align: right;
            font-weight: bold;
           
        }
        input,select,textarea{
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
            color: black;
          
        }
        input[type ="submit"]{
            background-color: #4caf50;
            
            border: none;
            cursor: pointer;
            width: auto;
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;

        }
        input[type ="submit "]:hover{
            background-color: #45a049;
            
        }
        textarea{
            height: 100px;
            resize: vertical;
            width: 300px;
            color: black;
           
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
        select{
            width: 214px;
            color: black;
            background-color: white;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .login{
            text-align: center;
            margin-top: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login :hover{
            transform: scale(1.1);
            transition: calc(.3s);
        }
        .h1{
            flex-direction: space-between;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            font-size: 30px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000000;
        }
        .logo{
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            top: 100px;

        }
        label{
            color: white;
        }
    </style>
</head>
<body>
<div class="logo">
            <img src="logo.png" alt="logo" width="200" height="200">
            </div>
     <form action="inicio.html" method="post">

        <div class="h1">
        <h1>CADASTRE-SE</h1>
        </div>
<div class="nome">
        <label for="nome"> Nome do aluno: </label>
        <input type="text" id="nome" placeholder="digite seu nome" required maxlength="50" />
        <br>
        </div>
        <div class="email">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="digite seu E-mail" required maxlength="50" />
            <br>
            </div>
        <div class="senha">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="digite a senha" required minlength="8" maxlength="20" />
        <br>
        </div>
        
        <div class="data">
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" required="22" />
        <br>
        </div>
       
            <div class="pais de residência">
                <label for="pais de residência:">País de residência:</label>
                <select id="pais de residência" name="pais de residência"  required="22">
                    <option>Brasil</option>
                    <option>EUA</option>
                    <option>Suiça</option>
                    <option>Canadá</option>
                    <option>França</option>
                </select>
            </div>
            <div class="login">
            <input type="submit" value="LOGIN" />
        </div>
    </form>
</body>
</html>
